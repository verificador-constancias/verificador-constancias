<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificación de constancias | UAEH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #333;
    }

    .encabezado {
      background: #ffffff;
      border-bottom: 4px solid #7a0019;
      padding: 22px 20px;
    }

    .encabezado-contenido {
      max-width: 900px;
      margin: 0 auto;
    }

    .institucion {
      color: #7a0019;
      font-size: 24px;
      font-weight: bold;
      margin: 0;
    }

    .subtitulo {
      margin: 6px 0 0;
      font-size: 15px;
      color: #666;
    }

    .contenedor {
      max-width: 700px;
      margin: 55px auto;
      padding: 0 20px;
    }

    .tarjeta {
      background: #ffffff;
      border-radius: 8px;
      padding: 35px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #333;
      font-size: 28px;
    }

    .descripcion {
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #7a0019;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 5px;
      background: #7a0019;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5f0014;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    #resultado {
      margin-top: 25px;
    }

    .resultado {
      padding: 20px;
      border-radius: 6px;
      line-height: 1.6;
    }

    .valida {
      background: #eef7ee;
      border: 1px solid #9bc59b;
    }

    .invalida {
      background: #f9eeee;
      border: 1px solid #d6aaaa;
    }

    .titulo-resultado {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .dato {
      margin: 7px 0;
    }

    .dato strong {
      display: inline-block;
      min-width: 120px;
    }

    .pie {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .contenedor {
        margin: 30px auto;
      }

      .tarjeta {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .institucion {
        font-size: 20px;
      }

      .dato strong {
        display: block;
      }
    }
  </style>
</head>

<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <p class="institucion">
        Universidad Autónoma del Estado de Hidalgo
      </p>

      <p class="subtitulo">
        Verificación de constancias de capacitación
      </p>
    </div>
  </header>


  <main class="contenedor">

    <section class="tarjeta">

      <h1>Verificación de constancia</h1>

      <p class="descripcion">
        Ingrese el folio de la constancia para consultar su autenticidad.
      </p>


      <label for="folio">
        Folio de la constancia
      </label>

      <input
        type="text"
        id="folio"
        autocomplete="off"
        placeholder="Ingrese el folio"
      >

      <button id="botonVerificar" type="button">
        Verificar
      </button>


      <div id="resultado"></div>

    </section>


    <p class="pie">
      Sistema de consulta de constancias de capacitación
    </p>

  </main>


  <script>

    /*
     * URL DEL SERVICIO DE VERIFICACIÓN
     *
     * Este es el Web App de Google Apps Script
     * que probamos anteriormente.
     */
    const URL_VERIFICADOR =
      'https://script.google.com/macros/s/AKfycbyiNuX8QHF3XxXkkdDPicnzTcBpufBr2-DfFz0_HFvhAJllrLSy5ZUsST-kD4kW1xigTg/exec';


    const campoFolio = document.getElementById('folio');
    const botonVerificar = document.getElementById('botonVerificar');
    const resultado = document.getElementById('resultado');


    botonVerificar.addEventListener('click', verificarFolio);


    campoFolio.addEventListener('keydown', function(evento) {

      if (evento.key === 'Enter') {
        verificarFolio();
      }

    });


    async function verificarFolio() {

      /*
       * IMPORTANTE:
       *
       * Tomamos exactamente lo que escribió el usuario.
       *
       * NO usamos:
       * trim()
       * toUpperCase()
       * toLowerCase()
       * reemplazos
       * eliminación de espacios
       * eliminación de guiones
       *
       * El folio debe coincidir exactamente.
       */
      const folio = campoFolio.value;


      if (folio === '') {

        mostrarResultado(
          false,
          'Folio no encontrado. Verifique que esté escrito correctamente.'
        );

        return;
      }


      botonVerificar.disabled = true;
      botonVerificar.textContent = 'Verificando...';

      resultado.innerHTML = '';


      try {

        /*
         * encodeURIComponent únicamente codifica el folio
         * para poder transportarlo correctamente dentro
         * de una URL.
         *
         * No modifica el valor que Apps Script recibe.
         */
        const url =
          URL_VERIFICADOR +
          '?folio=' +
          encodeURIComponent(folio);


        const respuesta = await fetch(url);

        if (!respuesta.ok) {
          throw new Error('Error HTTP ' + respuesta.status);
        }


        const datos = await respuesta.json();


        if (datos.valido === true) {

          mostrarConstanciaValida(datos);

        } else {

          mostrarResultado(
            false,
            'Folio no encontrado. Verifique que esté escrito correctamente.'
          );

        }


      } catch (error) {

        console.error(error);

        mostrarResultado(
          false,
          'No fue posible realizar la consulta. Intente nuevamente.'
        );

      } finally {

        botonVerificar.disabled = false;
        botonVerificar.textContent = 'Verificar';

      }

    }


    function mostrarConstanciaValida(datos) {

      const informacion = datos.datos;


      resultado.innerHTML = `

        <div class="resultado valida">

          <div class="titulo-resultado">
            Constancia válida
          </div>

          <div class="dato">
            <strong>Participante:</strong>
            ${escapeHtml(informacion.participante)}
          </div>

          <div class="dato">
            <strong>Curso:</strong>
            ${escapeHtml(informacion.curso)}
          </div>

          <div class="dato">
            <strong>Duración:</strong>
            ${escapeHtml(informacion.duracion)}
          </div>

          <div class="dato">
            <strong>Fecha:</strong>
            ${escapeHtml(informacion.fecha)}
          </div>

        </div>

      `;

    }


    function mostrarResultado(esValido, mensaje) {

      resultado.innerHTML = `

        <div class="resultado ${esValido ? 'valida' : 'invalida'}">

          <div class="titulo-resultado">
            ${escapeHtml(mensaje)}
          </div>

        </div>

      `;

    }


    /*
     * Evita que datos provenientes de la hoja
     * puedan interpretarse como código HTML.
     */
    function escapeHtml(texto) {

      const div = document.createElement('div');

      div.textContent = texto ?? '';

      return div.innerHTML;

    }

  </script>

</body>
</html>
